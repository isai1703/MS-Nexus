name: Android CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore MS Nexus release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MS_NEXUS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ms-nexus-release.jks"
          chmod 600 "$RUNNER_TEMP/ms-nexus-release.jks"

      - name: Build signed Release APK
        env:
          MS_NEXUS_KEYSTORE_PATH: ${{ runner.temp }}/ms-nexus-release.jks
          MS_NEXUS_KEYSTORE_PASSWORD: ${{ secrets.MS_NEXUS_KEYSTORE_PASSWORD }}
          MS_NEXUS_KEY_ALIAS: ${{ secrets.MS_NEXUS_KEY_ALIAS }}
          MS_NEXUS_KEY_PASSWORD: ${{ secrets.MS_NEXUS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ms-nexus-release-apk
          path: app/build/outputs/apk/release/app-release.apk
